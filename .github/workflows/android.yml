
name: Build SimpMusic Debug Apk V12 (ARM64 Only APK)

on:
  workflow_dispatch:
  push:
    branches:
      - Cloud-Sync

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SimpMusic
        uses: actions/checkout@v6
        with:
          ref: Cloud-Sync
          submodules: recursive

      - name: Use patched core
        run: |
          git submodule set-url core https://github.com/indominusrex9752-beep/core.git
          git -C core fetch origin patch-1
          git -C core checkout FETCH_HEAD

      - name: Apply Core Google Email Fix
        run: |
          git -C core apply --check "$GITHUB_WORKSPACE/SimpMusic-Core-GoogleEmail.patch"
          git -C core apply "$GITHUB_WORKSPACE/SimpMusic-Core-GoogleEmail.patch"

      - name: Apply SimpMusic Insights patch
        run: |
          echo "Applying SimpMusic Insights..."
          test -f SimpMusic-Insights-stage1-patch.zip
          unzip -o SimpMusic-Insights-stage1-patch.zip -d .
          echo "Insights patch applied."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Configure build and Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "isFullBuild=true" >> gradle.properties

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing Supabase GitHub secrets."
            exit 1
          fi

          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> local.properties

      - name: Apply Cloud Sync authentication patch
        run: |
          git apply --check SimpMusic-Cloud-Sync-Auth-Stage1.patch
          git apply SimpMusic-Cloud-Sync-Auth-Stage1.patch

      - name: Apply Cloud Sync UI patch
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage2-UI.patch
          git apply SimpMusic-Cloud-Sync-Stage2-UI.patch

      - name: Apply Cloud Sync Stage 3
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage3.patch
          git apply SimpMusic-Cloud-Sync-Stage3.patch

      - name: Apply Stage 3 Verification Fix
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage3-Fix.patch
          git apply SimpMusic-Cloud-Sync-Stage3-Fix.patch

      - name: Apply Verification Diagnostics
        run: |
          test -f SimpMusic-Cloud-Sync-Verification-Diagnostics.patch
          git apply --check SimpMusic-Cloud-Sync-Verification-Diagnostics.patch
          git apply SimpMusic-Cloud-Sync-Verification-Diagnostics.patch

      - name: Apply V11 Channel Handle Matching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncActivity.kt")
          lines = source.read_text().splitlines(keepends=True)

          starts = [i for i, line in enumerate(lines) if line.strip() == "val selectedPageId = selectedAccount.pageId?.trim().orEmpty()"]
          ends = [i for i, line in enumerate(lines) if line.strip() == "val youtubeGoogleEmail = selectedLiveAccount.googleEmail?.trim().orEmpty()"]
          if len(starts) != 1 or len(ends) != 1 or starts[0] >= ends[0]:
              raise SystemExit(f"Expected one ordered pair of account-matching anchors; starts={len(starts)}, ends={len(ends)}. No source changed.")

          replacement = [
              "                val selectedPageId = selectedAccount.pageId?.trim().orEmpty()\n",
              "                fun normalizeChannelHandle(value: String?): String =\n",
              "                    value?.trim()?.removePrefix(\"@\")?.lowercase().orEmpty()\n",
              "\n",
              "                val selectedHandle = normalizeChannelHandle(selectedAccount.email)\n",
              "                val selectedLiveAccount = if (selectedPageId.isNotBlank()) {\n",
              "                    liveAccounts.firstOrNull { it.pageId?.trim() == selectedPageId }\n",
              "                        ?: liveAccounts.filter {\n",
              "                            selectedHandle.isNotBlank() &&\n",
              "                                normalizeChannelHandle(it.email) == selectedHandle\n",
              "                        }.singleOrNull()\n",
              "                } else {\n",
              "                    liveAccounts.filter {\n",
              "                        selectedHandle.isNotBlank() &&\n",
              "                            normalizeChannelHandle(it.email) == selectedHandle\n",
              "                    }.singleOrNull()\n",
              "                }\n",
              "\n",
              "                if (selectedLiveAccount == null) {\n",
              "                    verificationState.value = \"Diagnostic: no unique live YouTube account matched the selected channel handle.\"\n",
              "                    return@launch\n",
              "                }\n",
              "\n",
          ]

          source.write_text("".join(lines[:starts[0]] + replacement + lines[ends[0]:]))
          print("V11 account-matching block replaced between verified source anchors.")
          PY
          git diff --check
          git diff -- androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncActivity.kt

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Verify ARM64-only build configuration
        run: |
          test "$(grep -Fc 'abiFilters.add("arm64-v8a")' androidApp/build.gradle.kts)" -eq 1
          if grep -Eq 'abiFilters.add("(armeabi-v7a|x86_64)")' androidApp/build.gradle.kts; then
            echo "::error::A non-ARM64 ABI filter is still configured."
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew -PisFullBuild=true androidApp:assembleDebug

      - name: Verify APK contains ARM64 libraries only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk_dir = Path("androidApp/build/outputs/apk/debug")
          apks = sorted(apk_dir.glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one debug APK, found {len(apks)}: {[p.name for p in apks]}")

          apk = apks[0]
          with ZipFile(apk) as archive:
              abis = sorted({
                  name.split("/")[1]
                  for name in archive.namelist()
                  if name.startswith("lib/") and len(name.split("/")) > 2 and name.endswith(".so")
              })

          print(f"APK: {apk.name}")
          print(f"Size: {apk.stat().st_size / (1024 * 1024):.2f} MiB")
          print(f"Native ABIs: {abis}")
          if abis != ["arm64-v8a"]:
              raise SystemExit(f"Expected only arm64-v8a native libraries, found: {abis}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Cloud-Sync-Debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
