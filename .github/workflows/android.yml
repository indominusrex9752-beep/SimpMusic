
name: Build SimpMusic Debug APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SimpMusic
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use patched core
        run: |
          git submodule set-url core https://github.com/indominusrex9752-beep/core.git
          git -C core fetch origin patch-1
          git -C core checkout FETCH_HEAD

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Configure build
        run: |
          echo "isFullBuild=true" >> gradle.properties

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Patched-Debug
          path: androidApp/build/outputs/apk/debug/*.apk
          
