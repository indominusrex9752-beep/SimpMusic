name: SimpMusic Debug APK V17 (Version Upgrade 2.7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SimpMusic
        uses: actions/checkout@v6
        with:
          ref: Version-Upgrade
          submodules: recursive

      - name: Use SimpCloud core
        run: |
          git submodule set-url core https://github.com/indominusrex9752-beep/core.git
          git -C core fetch origin Version-Upgrade
          git -C core checkout FETCH_HEAD

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Three-way merge Insights with official 2.7.0
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          archive = "SimpMusic-Insights-stage1-patch.zip"
          main_base = "140673ab2f2b83d5a2264d3a5f51f1dce3ab6b05"
          main_head = "30a8614ab5849f0d7f33b29b8292c04a532d5898"

          def run(args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)

          run(["git", "fetch", "https://github.com/maxrave-dev/SimpMusic.git", main_base, main_head])
          run(["git", "cat-file", "-e", f"{main_head}^{{commit}}"])
          run(["git", "merge-base", "--is-ancestor", main_head, "HEAD"])
          core_base_line = run(
              ["git", "ls-tree", main_base, "core"],
              text=True, stdout=subprocess.PIPE
          ).stdout.strip().split()
          if len(core_base_line) < 3:
              raise SystemExit("Could not resolve the official 2.6.0 core merge base.")
          core_base = core_base_line[2]
          run([
              "git", "-C", "core", "fetch",
              "https://github.com/maxrave-dev/core.git", core_base
          ])
          run(["git", "-C", "core", "cat-file", "-e", f"{core_base}^{{commit}}"])

          merged = {}
          conflicts = []
          with zipfile.ZipFile(archive) as patch, tempfile.TemporaryDirectory() as temp:
              temp = pathlib.Path(temp)
              for index, name in enumerate(patch.namelist()):
                  if not name or name.endswith("/") or name == "PATCH_NOTES.txt":
                      continue
                  rel = pathlib.PurePosixPath(name)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")

                  is_core = rel.parts[0] == "core"
                  target_rel = pathlib.Path(*rel.parts[1:]) if is_core else pathlib.Path(*rel.parts)
                  repo_dir = pathlib.Path("core") if is_core else pathlib.Path(".")
                  base_commit = core_base if is_core else main_base
                  target = repo_dir / target_rel
                  overlay_data = patch.read(name)

                  overlay_file = temp / f"overlay-{index}"
                  overlay_file.write_bytes(overlay_data)
                  if not target.exists():
                      merged[target] = overlay_data
                      continue

                  base_result = subprocess.run(
                      ["git", "-C", str(repo_dir), "show", f"{base_commit}:{target_rel.as_posix()}"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if base_result.returncode != 0:
                      conflicts.append((name, "target exists but no common-base file exists"))
                      continue

                  current_file = temp / f"current-{index}"
                  base_file = temp / f"base-{index}"
                  current_file.write_bytes(target.read_bytes())
                  base_file.write_bytes(base_result.stdout)
                  result = subprocess.run(
                      [
                          "git", "merge-file", "-p",
                          "-L", "SimpMusic-2.7.0-plus-SimpCloud",
                          "-L", "official-2.6.0-base",
                          "-L", "Insights-stage1",
                          str(current_file), str(base_file), str(overlay_file)
                      ],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if result.returncode == 0:
                      merged[target] = result.stdout
                  else:
                      conflicts.append((name, "three-way merge has overlapping edits"))

          if conflicts:
              print("::error::Insights merge needs manual conflict resolution:")
              for name, reason in conflicts:
                  print(f" - {name}: {reason}")
              sys.exit(1)

          for target, data in merged.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          # Remove the duplicated import present in the Stage-1 archive.
          repository = pathlib.Path("core/data/src/commonMain/kotlin/com/maxrave/data/repository/AnalyticsRepositoryImpl.kt")
          if repository.exists():
              lines = repository.read_text().splitlines()
              seen = set()
              cleaned = []
              for line in lines:
                  if line.startswith("import ") and line in seen:
                      continue
                  if line.startswith("import "):
                      seen.add(line)
                  cleaned.append(line)
              repository.write_text("\n".join(cleaned) + "\n")

          # A stalled player must not accrue listening time merely because the timer advanced.
          accumulator = pathlib.Path("core/data/src/commonMain/kotlin/com/maxrave/data/mediaservice/PlaybackListeningAccumulator.kt")
          if accumulator.exists():
              source = accumulator.read_text()
              old = "if (elapsedMillis > 0L && positionDelta >= 0L && positionDelta <= plausibleMaximum) {"
              new = "if (elapsedMillis > 0L && positionDelta >= (elapsedMillis / 10L).coerceAtLeast(1L) && positionDelta <= plausibleMaximum) {"
              if old not in source:
                  raise SystemExit("Could not find the expected accumulator condition; refusing an unsafe edit.")
              accumulator.write_text(source.replace(old, new, 1))

          print(f"Successfully merged {len(merged)} Insights files with the 2.7.0 source.")
          print("Duplicate import removed; stalled-position intervals are excluded.")
          PY

      - name: Validate merged Insights implementation
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          required = [
              "core/data/src/commonMain/kotlin/com/maxrave/data/mediaservice/PlaybackListeningAccumulator.kt",
              "core/data/src/commonMain/kotlin/com/maxrave/data/repository/AnalyticsRepositoryImpl.kt",
              "core/data/src/commonMain/kotlin/DatabaseDao.kt",
              "core/data/src/androidMain/kotlin/com/maxrave/data/mediaservice/MediaServiceHandlerImpl.kt",
              "core/data/src/jvmMain/kotlin/com/maxrave/data/mediaservice/JvmMediaPlayerHandlerImpl.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/App.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/AnalyticsViewModel.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/analytics/AnalyticsScreen.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/analytics/AnalyticsFormat.kt",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit("Missing merged Insights files: " + ", ".join(missing))

          accumulator = (root / required[0]).read_text()
          expected_guard = "positionDelta >= (elapsedMillis / 10L).coerceAtLeast(1L)"
          if expected_guard not in accumulator:
              raise SystemExit("Playback tracker still accepts a zero-progress stall.")

          repository = (root / required[1]).read_text()
          duplicate_import = "import kotlinx.coroutines.withContext"
          if repository.splitlines().count(duplicate_import) != 1:
              raise SystemExit("AnalyticsRepositoryImpl must contain exactly one withContext import.")

          dao = (root / required[2]).read_text()
          if "listenedSecond >= 30" not in dao:
              raise SystemExit("The 30-second complete-play threshold is missing.")

          view_model = (root / required[6]).read_text()
          if "LocalDate(2026, 11, 1)" not in view_model:
              raise SystemExit("All Time is not bounded from 1 November 2026.")

          screen = (root / required[7]).read_text()
          if "CUSTOM_RANGE" not in screen or "DateRangePicker" not in screen:
              raise SystemExit("Custom date-range filtering is incomplete.")

          app = (root / required[5]).read_text()
          if "AnalyticsDestination" not in app:
              raise SystemExit("The Insights destination is not wired into the app.")

          account_settings = root / "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/SettingScreen.kt"
          account_ui = account_settings.read_text()
          settings_view_model = root / "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/SettingsViewModel.kt"
          if "selectedYouTubeGoogleEmail" not in settings_view_model.read_text():
              raise SystemExit("The selected YouTube Google identity lookup is missing.")
          if "selectedYouTubeGoogleEmail" not in account_ui or "SimpCloud matching unavailable" not in account_ui:
              raise SystemExit("The selected YouTube account matching diagnostic is missing.")

          resources = root / "composeApp/src/commonMain/composeResources/values/strings.xml"
          ET.parse(resources)
          print("Insights merge checks passed: files, 30-second threshold, stall guard, date filters, navigation and XML.")
          PY

      - name: Configure build and Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "isFullBuild=true" >> gradle.properties
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing Supabase GitHub secrets."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> local.properties

      - name: Apply SimpCloud Google OAuth foundation
        run: |
          git apply --check SimpMusic-Cloud-Sync-Auth-Stage1.patch
          git apply SimpMusic-Cloud-Sync-Auth-Stage1.patch

      - name: Apply SimpCloud 2.7-compatible interface foundation
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage2-UI-2.7.patch
          git apply SimpMusic-Cloud-Sync-Stage2-UI-2.7.patch
          git apply --check SimpMusic-Cloud-Sync-Stage2-UI-2.7-Integration.patch
          git apply SimpMusic-Cloud-Sync-Stage2-UI-2.7-Integration.patch

      - name: Apply SimpCloud playback sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V13-Playback.patch
          git apply SimpMusic-Cloud-Sync-V13-Playback.patch

      - name: Apply SimpCloud V14 automatic sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V14-AutoSync.patch
          git apply SimpMusic-Cloud-Sync-V14-AutoSync.patch

      - name: Apply SimpCloud V14 realtime and manual sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V14-Realtime.patch
          git apply SimpMusic-Cloud-Sync-V14-Realtime.patch

      - name: Enforce selected YouTube and SimpCloud account matching
        run: |
          git apply --check SimpMusic-Cloud-Sync-V17-Account-Matching.patch
          git apply SimpMusic-Cloud-Sync-V17-Account-Matching.patch

      - name: Apply SimpCloud V15 immediate manual sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V15-ManualSync.patch
          git apply SimpMusic-Cloud-Sync-V15-ManualSync.patch

      - name: Apply SimpCloud V16 full settings sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V16-FullSettings.patch
          git apply SimpMusic-Cloud-Sync-V16-FullSettings.patch

      - name: Add 2.7 settings to cloud sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V17-Settings-Keys.patch
          git apply SimpMusic-Cloud-Sync-V17-Settings-Keys.patch

      - name: Preserve complete YouTube playlist shuffle
        run: |
          cp v17-overlay/composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/PlaylistViewModel.kt composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/PlaylistViewModel.kt

      - name: Verify upstream base
        run: |
          grep -q 'version-name = "2.7.0"' gradle/libs.versions.toml
          CORE_BASE="$(git ls-tree HEAD core | awk '{print $3}')"
          git -C core cat-file -e "$CORE_BASE^{commit}"
          git -C core merge-base --is-ancestor "$CORE_BASE" HEAD
          test "$(git -C core rev-parse HEAD)" = "88c1cf256f57ca07d90993d5fc966e96a71ecedb"

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew -PisFullBuild=true androidApp:assembleDebug

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Version-Upgrade-V17-Debug
          path: androidApp/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          compression-level: 0
