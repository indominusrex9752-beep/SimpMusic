name: SimpMusic Debug Apk V17 (Cloud Sync Account Matching)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom SimpMusic foundation
        uses: actions/checkout@v6
        with:
          ref: Cloud-Sync
          fetch-depth: 0
          submodules: recursive

      - name: Fetch V17 integration tools from the upgrade branch
        run: |
          git fetch origin \
            '+refs/heads/Cloud-Sync:refs/remotes/origin/Cloud-Sync' \
            '+refs/heads/Version-Upgrade:refs/remotes/origin/Version-Upgrade'
          mkdir -p v17-overlay
          git show origin/Version-Upgrade:v17-overlay/merge_custom_insights.py > v17-overlay/merge_custom_insights.py
          git show origin/Version-Upgrade:v17-overlay/apply_crash_safe_insights.py > v17-overlay/apply_crash_safe_insights.py
          git show origin/Version-Upgrade:v17-overlay/apply_selected_2_7_features.py > v17-overlay/apply_selected_2_7_features.py
          git show origin/Version-Upgrade:SimpMusic-Cloud-Sync-V17-Account-Matching.patch > SimpMusic-Cloud-Sync-V17-Account-Matching.patch
          git show origin/Version-Upgrade:SimpMusic-Cloud-Sync-V17-History-Upsert.patch > SimpMusic-Cloud-Sync-V17-History-Upsert.patch

      - name: Pin the 2.7-compatible SimpCloud core
        run: |
          git submodule set-url core https://github.com/indominusrex9752-beep/core.git
          CORE_SHA="88c1cf256f57ca07d90993d5fc966e96a71ecedb"
          git -C core fetch origin "$CORE_SHA"
          if [ "$(git -C core rev-parse --is-shallow-repository)" = "true" ]; then
            git -C core fetch --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          git -C core checkout --detach "$CORE_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          git -C core merge-base --is-ancestor 36db877b583bd262f70d716bb5db81366c9dd256 HEAD

      - name: Apply custom Insights and merge its core overlay safely
        run: |
          python3 -m py_compile v17-overlay/merge_custom_insights.py
          python3 v17-overlay/merge_custom_insights.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Configure build and Supabase
        env:
          SENTRY_DSN: \${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: \${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: \${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: \${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: \${{ secrets.DISCORD_CLIENT_ID }}
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: \${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "isFullBuild=true" >> gradle.properties
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing Supabase GitHub secrets."
            exit 1
          fi
          : > local.properties
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> local.properties
          printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN" >> local.properties
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          printf 'DISCORD_CLIENT_ID=%s\n' "$DISCORD_CLIENT_ID" >> local.properties
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> local.properties

      - name: Validate Supabase BuildKonfig wiring
        run: |
          grep -q '"supabaseUrl"' composeApp/build.gradle.kts
          grep -q '"supabasePublishableKey"' composeApp/build.gradle.kts
          grep -q 'properties.getProperty("SUPABASE_URL")' composeApp/build.gradle.kts
          grep -q 'properties.getProperty("SUPABASE_PUBLISHABLE_KEY")' composeApp/build.gradle.kts

      - name: Apply SimpCloud Google OAuth foundation
        run: |
          git apply --check SimpMusic-Cloud-Sync-Auth-Stage1.patch
          git apply SimpMusic-Cloud-Sync-Auth-Stage1.patch

      - name: Apply SimpCloud settings entry point
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage2-UI.patch
          git apply SimpMusic-Cloud-Sync-Stage2-UI.patch

      - name: Apply SimpCloud playback sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V13-Playback.patch
          git apply SimpMusic-Cloud-Sync-V13-Playback.patch

      - name: Apply SimpCloud V14 automatic sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V14-AutoSync.patch
          git apply SimpMusic-Cloud-Sync-V14-AutoSync.patch

      - name: Apply SimpCloud V14 realtime and manual sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V14-Realtime.patch
          git apply SimpMusic-Cloud-Sync-V14-Realtime.patch

      - name: Enforce selected YouTube and SimpCloud account matching
        run: |
          git apply --check SimpMusic-Cloud-Sync-V17-Account-Matching.patch
          git apply SimpMusic-Cloud-Sync-V17-Account-Matching.patch

      - name: Apply SimpCloud V15 immediate manual sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V15-ManualSync.patch
          git apply SimpMusic-Cloud-Sync-V15-ManualSync.patch

      - name: Apply SimpCloud V16 full settings sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V16-FullSettings.patch
          git apply SimpMusic-Cloud-Sync-V16-FullSettings.patch

      - name: Apply crash-safe Insights checkpoints
        run: |
          python3 -m py_compile v17-overlay/apply_crash_safe_insights.py
          python3 v17-overlay/apply_crash_safe_insights.py

      - name: Add idempotent synced playback history operations
        run: |
          git -C core apply --check ../SimpMusic-Cloud-Sync-V17-History-Upsert.patch
          git -C core apply ../SimpMusic-Cloud-Sync-V17-History-Upsert.patch
          git -C core diff --check

      - name: Port selected 2.7 features onto the custom app
        run: |
          python3 -m py_compile v17-overlay/apply_selected_2_7_features.py
          python3 v17-overlay/apply_selected_2_7_features.py

      - name: Validate custom Insights and crash-safe tracking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path(".")
          required = [
              "core/data/src/commonMain/kotlin/com/maxrave/data/mediaservice/PlaybackListeningAccumulator.kt",
              "core/data/src/commonMain/kotlin/com/maxrave/data/repository/AnalyticsRepositoryImpl.kt",
              "core/data/src/commonMain/kotlin/DatabaseDao.kt",
              "core/data/src/androidMain/kotlin/com/maxrave/data/mediaservice/MediaServiceHandlerImpl.kt",
              "core/data/src/jvmMain/kotlin/com/maxrave/data/mediaservice/JvmMediaPlayerHandlerImpl.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/App.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/AnalyticsViewModel.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/analytics/AnalyticsScreen.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/analytics/AnalyticsFormat.kt",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit("Missing custom Insights files: " + ", ".join(missing))

          accumulator = (root / required[0]).read_text()
          if "positionDelta >= (elapsedMillis / 10L).coerceAtLeast(1L)" not in accumulator:
              raise SystemExit("Playback tracker still accepts a zero-progress stall.")
          if "if (currentSong == null) {" not in accumulator or "lastPositionMillis = positionMillis" not in accumulator:
              raise SystemExit("Playback tracker does not reset its baseline when the current song is unavailable.")

          repository = (root / required[1]).read_text()
          if repository.splitlines().count("import kotlinx.coroutines.withContext") != 1:
              raise SystemExit("AnalyticsRepositoryImpl must contain exactly one withContext import.")

          view_model = (root / required[6]).read_text()
          for marker in ("LocalDate(2026, 11, 1)", "AnalyticsUiState.DayRange.THIS_MONTH", "CUSTOM_RANGE"):
              if marker not in view_model:
                  raise SystemExit(f"Custom Insights period is missing: {marker}")

          screen = (root / required[7]).read_text()
          if "CUSTOM_RANGE" not in screen or "DateRangePicker" not in screen:
              raise SystemExit("Custom date-range filtering is incomplete.")

          app = (root / required[5]).read_text()
          if "InsightsDestination" not in app:
              raise SystemExit("The custom Insights destination is not wired into the app.")

          for handler_path in required[3:5]:
              handler = (root / handler_path).read_text()
              for marker in ("listeningAccumulator.tick", "saveListeningSession", "listeningRecoveryReady.await()", "persistListeningCheckpoint", "recoverListeningCheckpoint", "persistCompletedListeningSession"):
                  if marker not in handler:
                      raise SystemExit(f"Crash-safe playback marker {marker} is missing from {handler_path}.")
              if "mayBeTrackingListeningLocal" in handler:
                  raise SystemExit(f"Legacy percentage tracking still overlaps the 30-second accumulator in {handler_path}.")

          datasource = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/db/datasource/AnalyticsDatasource.kt").read_text()
          if "stableSyncId" not in datasource or "syncRecorder.play(stableSyncId)" not in datasource:
              raise SystemExit("Recovered Insights events are not connected to history sync.")
          if "PlaybackSyncSignal.notifyNewPlayback()" not in datasource:
              raise SystemExit("Recovered Insights events bypass the immediate playback-sync signal.")

          dao = (root / required[2]).read_text()
          if "listenedSecond >= 30" not in dao:
              raise SystemExit("The 30-second complete-play threshold is missing.")

          sync_dao = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/db/SyncDao.kt").read_text()
          if "suspend fun getPlaybackEventBySyncId(syncId: String): PlaybackEventEntity?" not in sync_dao:
              raise SystemExit("SyncDao history lookup is missing.")
          if "suspend fun updatePlaybackEvent(event: PlaybackEventEntity)" not in sync_dao:
              raise SystemExit("SyncDao history update is missing.")

          sync_applier = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/librarysync/SyncApplier.kt").read_text()
          if "getPlaybackEventBySyncId(event.syncId)" not in sync_applier or "existing.copy(listenedSecond = event.listenedSecond)" not in sync_applier:
              raise SystemExit("Recovered history events are not idempotently upserted.")
          if "dao.updatePlaybackEvent(existing.copy(listenedSecond = event.listenedSecond))\n                // The host must log this newer version so already-paired devices receive it too.\n                return true" not in sync_applier:
              raise SystemExit("Newer recovered play durations are not re-published to paired devices.")

          analytics_api = (root / "core/domain/src/commonMain/kotlin/com/maxrave/domain/repository/AnalyticsRepository.kt").read_text()
          if "syncId: String? = null" not in analytics_api or "timestamp: LocalDateTime? = null" not in analytics_api:
              raise SystemExit("AnalyticsRepository does not accept stable event identity and original session time.")
          analytics_impl = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/repository/AnalyticsRepositoryImpl.kt").read_text()
          if "                    syncId," not in analytics_impl or "                    timestamp," not in analytics_impl:
              raise SystemExit("AnalyticsRepositoryImpl does not forward checkpoint identity and timestamp.")

          resources = ET.parse(root / "composeApp/src/commonMain/composeResources/values/strings.xml").getroot()
          names = [item.attrib.get("name") for item in resources if item.tag == "string"]
          for key in ("this_month", "all_time"):
              if names.count(key) != 1:
                  raise SystemExit(f"Custom Insights resource {key} is missing or duplicated.")
          print("Custom Insights, date filters, 30-second threshold, crash recovery and history upserts passed.")
          PY

      - name: Validate selected 2.7 features and preserved custom systems
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          def read(path):
              target = root / path
              if not target.is_file():
                  raise SystemExit(f"Selected V17 feature file is missing: {path}")
              return target.read_text()

          radio = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/other/RadioBuilderScreen.kt")
          radio_vm = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/RadioBuilderViewModel.kt")
          if "RadioBuilderDestination" not in radio or "radioId()" not in radio_vm:
              raise SystemExit("Radio Builder is not fully connected.")

          replay = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/LibraryDynamicPlaylistViewModel.kt")
          library = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/library/LibraryScreen.kt")
          if "ReplayMix" not in replay or "replayMix" not in library:
              raise SystemExit("Replay Mix is not wired into the library.")

          lyrics = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/SharedViewModel.kt")
          sheet = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/component/ModalBottomSheet.kt")
          if "fun deleteLyrics(" not in lyrics or "onDeleteLyrics" not in sheet:
              raise SystemExit("Delete Lyrics is not connected to the song menu.")

          background = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/component/LyricsFlowBackground.kt")
          fullscreen = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/component/FullscreenLyricsContent.kt")
          if "LyricsFlowBackground" not in fullscreen or not background.strip():
              raise SystemExit("Animated lyrics background is incomplete.")

          theme = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/theme/Theme.kt")
          settings = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/SettingScreen.kt")
          if "THEME_MODE_AMOLED" not in theme or "theme_mode_amoled" not in settings:
              raise SystemExit("AMOLED theme is not selectable.")
          if "setAnimatedLyricsBackground" not in settings or "setLyricsBackgroundPulse" not in settings:
              raise SystemExit("Animated lyrics settings are not exposed.")

          desktop = read("composeApp/src/jvmMain/kotlin/com/maxrave/simpmusic/DesktopApp.kt")
          if "DesktopFullscreen" not in desktop:
              raise SystemExit("Desktop fullscreen support is not wired.")
          read("composeApp/src/jvmMain/kotlin/com/maxrave/simpmusic/ui/component/MacAppearance.kt")

          playlist = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/PlaylistViewModel.kt")
          for marker in ("getContinueTrack(", "allTracks.shuffled()", "shuffleEndpoint", "getRadioFromEndpoint"):
              if marker not in playlist:
                  raise SystemExit(f"The existing custom shuffle fix is missing: {marker}")
          if "visited" not in playlist:
              raise SystemExit("The custom shuffle continuation loop has no visited-token guard.")

          settings_sync = read("androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncSettingsSync.kt")
          for key in ('"title_marquee"', '"animated_lyrics_background"', '"lyrics_background_pulse"'):
              if key not in settings_sync:
                  raise SystemExit(f"New non-AI setting is not included in cloud sync: {key}")
          if '"ai_provider"' in settings_sync or '"custom_model_id"' in settings_sync:
              raise SystemExit("AI-provider settings were incorrectly added to cloud sync.")

          app = read("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/App.kt")
          if "titleMarquee = titleMarquee" not in app or "InsightsDestination" not in app:
              raise SystemExit("The custom Insights app root or title-marquee preference is missing.")

          resources = read("composeApp/src/commonMain/composeResources/values/strings.xml")
          for key in ('name="theme_mode_amoled"', 'name="replay_mix"', 'name="delete_lyrics"'):
              if key not in resources:
                  raise SystemExit(f"Selected feature resource is missing: {key}")
          print("Radio Builder, Replay Mix, lyrics, AMOLED, desktop, settings and shuffle checks passed.")
          PY

      - name: Validate selected YouTube and SimpCloud account matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings_vm = Path("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/SettingsViewModel.kt").read_text()
          settings_ui = Path("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/SettingScreen.kt").read_text()
          auth = Path("androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncAuth.kt").read_text()
          switcher = Path("core/service/kotlinYtmusicScraper/src/commonMain/kotlin/com/maxrave/kotlinytmusicscraper/models/response/AccountSwitcherEndpointResponse.kt").read_text()
          mapping = Path("core/data/src/commonMain/kotlin/com/maxrave/data/mapping/Mapping.kt").read_text()
          if "selectedYouTubeGoogleEmail" not in settings_vm or "refreshSelectedYouTubeGoogleEmail()" not in settings_vm:
              raise SystemExit("Selected YouTube Google identity lookup is missing.")
          if "SimpCloud matching unavailable" not in settings_ui or "YouTube Google email:" not in settings_ui:
              raise SystemExit("The selected-account matching diagnostic is missing.")
          if "selectedAccount.googleEmail" not in auth or "cloudEmail" not in auth:
              raise SystemExit("SimpCloud does not compare the authenticated Google identity with the selected YouTube account.")
          if "googleAccountHeaderRenderer" not in switcher or "googleEmail = googleEmail" not in switcher:
              raise SystemExit("YouTube account-switcher email extraction is missing.")
          if "googleEmail = this.googleEmail" not in mapping:
              raise SystemExit("YouTube Google email is not forwarded into the domain model.")
          print("Selected YouTube identity and SimpCloud account-matching checks passed.")
          PY

      - name: Keep Insights recovery checkpoints device-local
        run: |
          SETTINGS_SYNC="androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncSettingsSync.kt"
          if grep -q 'analytics_active_listening_checkpoint_v1' "$SETTINGS_SYNC"; then
            echo "::error::Unfinished local Insights checkpoints must never sync between devices."
            exit 1
          fi

      - name: Final source hygiene
        run: |
          git diff --check
          git -C core diff --check
          python3 - <<'PY'
          from pathlib import Path
          markers = ("<<<<<<< ", "=======", ">>>>>>> ")
          bad = []
          for root in (Path("."), Path("core")):
              for path in root.rglob("*"):
                  if not path.is_file() or ".git" in path.parts or path.suffix not in {".kt", ".kts", ".xml"}:
                      continue
                  try:
                      lines = path.read_text().splitlines()
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(lines, 1):
                      if line.startswith(markers):
                          bad.append(f"{path}:{number}")
          if bad:
              raise SystemExit("Unresolved merge markers: " + ", ".join(bad[:30]))
          print("Whitespace and merge-marker checks passed.")
          PY

      - name: Verify V17 source and core baseline
        run: |
          grep -q 'version-name = "2.7.0"' gradle/libs.versions.toml
          test "$(git -C core rev-parse HEAD)" = "88c1cf256f57ca07d90993d5fc966e96a71ecedb"
          git -C core merge-base --is-ancestor 36db877b583bd262f70d716bb5db81366c9dd256 HEAD

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew -PisFullBuild=true androidApp:assembleDebug

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Version-Upgrade-V17-Debug
          path: androidApp/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          compression-level: 0
