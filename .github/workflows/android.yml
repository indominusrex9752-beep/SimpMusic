
name: Build SimpMusic Debug Apk V11 (Cloud Sync Account Matching)

on:
  workflow_dispatch:
  push:
    branches:
      - Cloud-Sync

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SimpMusic
        uses: actions/checkout@v6
        with:
          ref: Cloud-Sync
          submodules: recursive

      - name: Use patched core
        run: |
          git submodule set-url core https://github.com/indominusrex9752-beep/core.git
          git -C core fetch origin patch-1
          git -C core checkout FETCH_HEAD

      - name: Apply Core Google Email Fix
        run: |
          git -C core apply --check "$GITHUB_WORKSPACE/SimpMusic-Core-GoogleEmail.patch"
          git -C core apply "$GITHUB_WORKSPACE/SimpMusic-Core-GoogleEmail.patch"

      - name: Apply SimpMusic Insights patch
        run: |
          echo "Applying SimpMusic Insights..."
          test -f SimpMusic-Insights-stage1-patch.zip
          unzip -o SimpMusic-Insights-stage1-patch.zip -d .
          echo "Insights patch applied."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Configure build and Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "isFullBuild=true" >> gradle.properties

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing Supabase GitHub secrets."
            exit 1
          fi

          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> local.properties

      - name: Apply Cloud Sync authentication patch
        run: |
          git apply --check SimpMusic-Cloud-Sync-Auth-Stage1.patch
          git apply SimpMusic-Cloud-Sync-Auth-Stage1.patch

      - name: Apply Cloud Sync UI patch
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage2-UI.patch
          git apply SimpMusic-Cloud-Sync-Stage2-UI.patch

      - name: Apply Cloud Sync Stage 3
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage3.patch
          git apply SimpMusic-Cloud-Sync-Stage3.patch

      - name: Apply Stage 3 Verification Fix
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage3-Fix.patch
          git apply SimpMusic-Cloud-Sync-Stage3-Fix.patch

      - name: Apply Verification Diagnostics
        run: |
          test -f SimpMusic-Cloud-Sync-Verification-Diagnostics.patch
          git apply --check SimpMusic-Cloud-Sync-Verification-Diagnostics.patch
          git apply SimpMusic-Cloud-Sync-Verification-Diagnostics.patch

      - name: Apply V11 Channel Handle Matching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncActivity.kt")
          content = source.read_text()

          old = """                val selectedPageId = selectedAccount.pageId?.trim().orEmpty()
                if (selectedPageId.isBlank()) {
                    verificationState.value = "Diagnostic: the selected YouTube account has no page ID, so its Google email cannot be matched safely."
                    return@launch
                }
                val selectedLiveAccount = liveAccounts.firstOrNull { it.pageId == selectedPageId }
                if (selectedLiveAccount == null) {
                    verificationState.value = "Diagnostic: the selected YouTube account was not found in the live account list. Refresh the YouTube account selection and try again."
                    return@launch
                }"""

          new = """                val selectedPageId = selectedAccount.pageId?.trim().orEmpty()
                fun normalizeChannelHandle(value: String?): String =
                    value?.trim()?.removePrefix("@")?.lowercase().orEmpty()

                val selectedHandle = normalizeChannelHandle(selectedAccount.email)
                val selectedLiveAccount = if (selectedPageId.isNotBlank()) {
                    liveAccounts.firstOrNull { it.pageId?.trim() == selectedPageId }
                        ?: liveAccounts.filter {
                            selectedHandle.isNotBlank() &&
                                normalizeChannelHandle(it.email) == selectedHandle
                        }.singleOrNull()
                } else {
                    liveAccounts.filter {
                        selectedHandle.isNotBlank() &&
                            normalizeChannelHandle(it.email) == selectedHandle
                    }.singleOrNull()
                }

                if (selectedLiveAccount == null) {
                    verificationState.value = "Diagnostic: no unique live YouTube account matched the selected channel handle."
                    return@launch
                }"""

          count = content.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one original account-matching block, found {count}; refusing to modify source.")
          source.write_text(content.replace(old, new, 1))
          print("V11 account-matching replacement applied exactly once.")
          PY
          git diff --check
          git diff -- androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncActivity.kt

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew -PisFullBuild=true androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Cloud-Sync-Debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
