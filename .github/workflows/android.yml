name: SimpMusic Debug APK V17 (Version Upgrade 2.7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SimpMusic
        uses: actions/checkout@v6
        with:
          ref: Version-Upgrade
          fetch-depth: 0
          submodules: recursive

      - name: Use SimpCloud core
        run: |
          git submodule set-url core https://github.com/indominusrex9752-beep/core.git
          CORE_SHA="88c1cf256f57ca07d90993d5fc966e96a71ecedb"
          git -C core fetch origin "$CORE_SHA"
          if [ "$(git -C core rev-parse --is-shallow-repository)" = "true" ]; then
            git -C core fetch --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          git -C core checkout --detach "$CORE_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Three-way merge Insights with official 2.7.0
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          archive = "SimpMusic-Insights-stage1-patch.zip"
          main_base = "140673ab2f2b83d5a2264d3a5f51f1dce3ab6b05"
          main_head = "30a8614ab5849f0d7f33b29b8292c04a532d5898"

          def run(args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)

          run(["git", "fetch", "https://github.com/maxrave-dev/SimpMusic.git", main_base, main_head])
          run(["git", "cat-file", "-e", f"{main_head}^{{commit}}"])
          run(["git", "merge-base", "--is-ancestor", main_head, "HEAD"])
          core_base_line = run(
              ["git", "ls-tree", main_base, "core"],
              text=True, stdout=subprocess.PIPE
          ).stdout.strip().split()
          if len(core_base_line) < 3:
              raise SystemExit("Could not resolve the official 2.6.0 core merge base.")
          core_base = core_base_line[2]
          run([
              "git", "-C", "core", "fetch",
              "https://github.com/maxrave-dev/core.git", core_base
          ])
          run(["git", "-C", "core", "cat-file", "-e", f"{core_base}^{{commit}}"])
          run(["git", "-C", "core", "merge-base", "--is-ancestor", core_base, "HEAD"])

          merged = {}
          conflicts = []
          insights_resource_entries = [
              '    <string name="this_month">This month</string>',
              '    <string name="all_time">All time</string>',
          ]
          insights_strings_path = "composeApp/src/commonMain/composeResources/values/strings.xml"
          app_path = "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/App.kt"
          app_marquee_line = b"    val titleMarquee by viewModel.getTitleMarquee().collectAsStateWithLifecycle(true)\\n"
          app_marquee_anchor = b"    val isLiquidGlassEnabled by viewModel.getEnableLiquidGlass().collectAsStateWithLifecycle(DataStoreManager.FALSE)\\n"
          with zipfile.ZipFile(archive) as patch, tempfile.TemporaryDirectory() as temp:
              temp = pathlib.Path(temp)
              for index, name in enumerate(patch.namelist()):
                  if not name or name.endswith("/") or name == "PATCH_NOTES.txt":
                      continue
                  rel = pathlib.PurePosixPath(name)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")

                  is_core = rel.parts[0] == "core"
                  target_rel = pathlib.Path(*rel.parts[1:]) if is_core else pathlib.Path(*rel.parts)
                  repo_dir = pathlib.Path("core") if is_core else pathlib.Path(".")
                  base_commit = core_base if is_core else main_base
                  target = repo_dir / target_rel
                  overlay_data = patch.read(name)
                  # Both upstream 2.7 and Stage-1 append strings at </resources>. Move
                  # the two Insights-only entries out of the overlay before diff3 so
                  # independent additions at EOF cannot become a false merge conflict.
                  if name == insights_strings_path:
                      resource_text = overlay_data.decode("utf-8")
                      for entry in insights_resource_entries:
                          if resource_text.count(entry) != 1:
                              raise SystemExit(f"Expected exactly one Insights resource entry: {entry}")
                          resource_text = resource_text.replace(entry + "\n", "", 1)
                      overlay_data = resource_text.encode("utf-8")

                  overlay_file = temp / f"overlay-{index}"
                  overlay_file.write_bytes(overlay_data)
                  if not target.exists():
                      merged[target] = overlay_data
                      continue

                  base_result = subprocess.run(
                      ["git", "-C", str(repo_dir), "show", f"{base_commit}:{target_rel.as_posix()}"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if base_result.returncode != 0:
                      conflicts.append((name, "target exists but no common-base file exists"))
                      continue

                  current_file = temp / f"current-{index}"
                  base_file = temp / f"base-{index}"
                  current_data = target.read_bytes()
                  preserve_title_marquee = name == app_path
                  if preserve_title_marquee:
                      if current_data.count(app_marquee_line) != 1:
                          raise SystemExit("Could not isolate the official 2.7 title-marquee addition before the App.kt merge.")
                      # 2.7 inserts this line exactly where Insights replaces the old Analytics-tab
                      # condition. Temporarily lift it out so diff3 can merge the independent edits.
                      current_data = current_data.replace(app_marquee_line, b"", 1)
                  current_file.write_bytes(current_data)
                  base_file.write_bytes(base_result.stdout)
                  result = subprocess.run(
                      [
                          "git", "merge-file", "-p",
                          "-L", "SimpMusic-2.7.0-plus-SimpCloud",
                          "-L", "official-2.6.0-base",
                          "-L", "Insights-stage1",
                          str(current_file), str(base_file), str(overlay_file)
                      ],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if result.returncode == 0:
                      merged_data = result.stdout
                      if preserve_title_marquee:
                          if merged_data.count(app_marquee_anchor) != 1:
                              raise SystemExit("Could not restore the official 2.7 title-marquee setting after the Insights App.kt merge.")
                          merged_data = merged_data.replace(app_marquee_anchor, app_marquee_anchor + app_marquee_line, 1)
                      merged[target] = merged_data
                  else:
                      conflicts.append((name, "three-way merge has overlapping edits"))

          if conflicts:
              print("::error::Insights merge needs manual conflict resolution:")
              for name, reason in conflicts:
                  print(f" - {name}: {reason}")
              sys.exit(1)

          # Re-add Insights strings after the 2.7 merge, avoiding an EOF/EOF insertion conflict.
          strings_target = pathlib.Path(insights_strings_path)
          if strings_target in merged:
              resource_text = merged[strings_target].decode("utf-8")
              for entry in insights_resource_entries:
                  resource_name = entry.split('"')[1]
                  if f'name="{resource_name}"' not in resource_text:
                      if resource_text.count("</resources>") != 1:
                          raise SystemExit("Could not safely place the Insights resource strings.")
                      resource_text = resource_text.replace("</resources>", entry + "\n</resources>", 1)
              merged[strings_target] = resource_text.encode("utf-8")

          for target, data in merged.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          # Remove the duplicated import present in the Stage-1 archive.
          repository = pathlib.Path("core/data/src/commonMain/kotlin/com/maxrave/data/repository/AnalyticsRepositoryImpl.kt")
          if repository.exists():
              lines = repository.read_text().splitlines()
              seen = set()
              cleaned = []
              for line in lines:
                  if line.startswith("import ") and line in seen:
                      continue
                  if line.startswith("import "):
                      seen.add(line)
                  cleaned.append(line)
              repository.write_text("\n".join(cleaned) + "\n")

          # A stalled player must not accrue listening time merely because the timer advanced.
          accumulator = pathlib.Path("core/data/src/commonMain/kotlin/com/maxrave/data/mediaservice/PlaybackListeningAccumulator.kt")
          if accumulator.exists():
              source = accumulator.read_text()
              old = "if (elapsedMillis > 0L && positionDelta >= 0L && positionDelta <= plausibleMaximum) {"
              new = "if (elapsedMillis > 0L && positionDelta >= (elapsedMillis / 10L).coerceAtLeast(1L) && positionDelta <= plausibleMaximum) {"
              if old not in source:
                  raise SystemExit("Could not find the expected accumulator condition; refusing an unsafe edit.")
              source = source.replace(old, new, 1)
              null_song_old = "        if (currentSong == null) return null"
              null_song_new = """        if (currentSong == null) {
            // Do not let an interval without a verified current track accrue to the next tick.
            lastPositionMillis = positionMillis
            lastTick = TimeSource.Monotonic.markNow()
            return null
        }"""
              if null_song_old not in source:
                  raise SystemExit("Could not find the expected null-song guard; refusing an unsafe edit.")
              source = source.replace(null_song_old, null_song_new, 1)
              accumulator.write_text(source)

          print(f"Successfully merged {len(merged)} Insights files with the 2.7.0 source.")
          print("Duplicate import removed; stalled-position intervals are excluded.")
          PY

      - name: Apply crash-safe Insights checkpoints
        run: |
          python3 -m py_compile v17-overlay/apply_crash_safe_insights.py
          python3 v17-overlay/apply_crash_safe_insights.py

      - name: Add idempotent synced playback history DAO operations
        run: |
          git -C core apply --check ../SimpMusic-Cloud-Sync-V17-History-Upsert.patch
          git -C core apply ../SimpMusic-Cloud-Sync-V17-History-Upsert.patch
          git -C core diff --check

      - name: Validate merged Insights implementation
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          required = [
              "core/data/src/commonMain/kotlin/com/maxrave/data/mediaservice/PlaybackListeningAccumulator.kt",
              "core/data/src/commonMain/kotlin/com/maxrave/data/repository/AnalyticsRepositoryImpl.kt",
              "core/data/src/commonMain/kotlin/DatabaseDao.kt",
              "core/data/src/androidMain/kotlin/com/maxrave/data/mediaservice/MediaServiceHandlerImpl.kt",
              "core/data/src/jvmMain/kotlin/com/maxrave/data/mediaservice/JvmMediaPlayerHandlerImpl.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/App.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/AnalyticsViewModel.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/analytics/AnalyticsScreen.kt",
              "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/analytics/AnalyticsFormat.kt",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit("Missing merged Insights files: " + ", ".join(missing))

          accumulator = (root / required[0]).read_text()
          expected_guard = "positionDelta >= (elapsedMillis / 10L).coerceAtLeast(1L)"
          if expected_guard not in accumulator:
              raise SystemExit("Playback tracker still accepts a zero-progress stall.")
          if "if (currentSong == null) {" not in accumulator or "lastPositionMillis = positionMillis" not in accumulator:
              raise SystemExit("Playback tracker does not reset its baseline when the current song is unavailable.")

          repository = (root / required[1]).read_text()
          duplicate_import = "import kotlinx.coroutines.withContext"
          if repository.splitlines().count(duplicate_import) != 1:
              raise SystemExit("AnalyticsRepositoryImpl must contain exactly one withContext import.")

          dao = (root / required[2]).read_text()
          if "listenedSecond >= 30" not in dao:
              raise SystemExit("The 30-second complete-play threshold is missing.")

          view_model = (root / required[6]).read_text()
          if "LocalDate(2026, 11, 1)" not in view_model:
              raise SystemExit("All Time is not bounded from 1 November 2026.")
          if "AnalyticsUiState.DayRange.THIS_MONTH" not in view_model:
              raise SystemExit("This month is not configured as the Insights default.")

          for handler_path in required[3:5]:
              handler = (root / handler_path).read_text()
              if "listeningAccumulator.tick" not in handler or "saveListeningSession" not in handler:
                  raise SystemExit(f"Playback listening tracking is not wired into {handler_path}.")

          checkpoint_source = accumulator
          if "ListeningSessionCheckpoint" not in checkpoint_source or "sessionSyncId = newSyncId()" not in checkpoint_source:
              raise SystemExit("Durable, uniquely identified listening checkpoints are missing.")
          if "lastCheckpointMillis < 30_000L" not in checkpoint_source or "listenedMillis - lastCheckpointMillis < 2_000L" not in checkpoint_source:
              raise SystemExit("Checkpoint cadence or immediate 30-second threshold persistence is missing.")
          if "List<ListeningSessionCheckpoint>" not in (root / "core/data/src/androidMain/kotlin/com/maxrave/data/mediaservice/MediaServiceHandlerImpl.kt").read_text():
              raise SystemExit("The checkpoint store cannot retain multiple interrupted track sessions.")
          dao_checkpoint = (root / required[2]).read_text()
          if "getPlaybackEventBySyncId" not in dao_checkpoint or "updatePlaybackEvent(existing.copy(listenedSecond = maxOf(existing.listenedSecond, listenedSecond)))" not in dao_checkpoint:
              raise SystemExit("Recovered Insights events are not idempotent.")
          datasource = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/db/datasource/AnalyticsDatasource.kt").read_text()
          if "stableSyncId" not in datasource or "syncRecorder.play(stableSyncId)" not in datasource:
              raise SystemExit("Checkpoint recovery is not connected to the existing history-sync event.")
          if "PlaybackSyncSignal.notifyNewPlayback()" not in datasource:
              raise SystemExit("Checkpoint recovery bypasses the existing immediate playback-sync signal.")
          sync_applier = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/librarysync/SyncApplier.kt").read_text()
          if "getPlaybackEventBySyncId(event.syncId)" not in sync_applier or "existing.copy(listenedSecond = event.listenedSecond)" not in sync_applier:
              raise SystemExit("A retried history event cannot update its existing synced play.")
          if "dao.updatePlaybackEvent(existing.copy(listenedSecond = event.listenedSecond))\n                // The host must log this newer version so already-paired devices receive it too.\n                return true" not in sync_applier:
              raise SystemExit("A newer recovered play duration is not re-published to already-paired devices.")
          sync_dao = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/db/SyncDao.kt").read_text()
          if "suspend fun getPlaybackEventBySyncId(syncId: String): PlaybackEventEntity?" not in sync_dao or "suspend fun updatePlaybackEvent(event: PlaybackEventEntity)" not in sync_dao:
              raise SystemExit("SyncApplier history upserts are missing their SyncDao methods.")

          analytics_api = (root / "core/domain/src/commonMain/kotlin/com/maxrave/domain/repository/AnalyticsRepository.kt").read_text()
          if "syncId: String? = null" not in analytics_api or "timestamp: LocalDateTime? = null" not in analytics_api:
              raise SystemExit("AnalyticsRepository does not accept stable event identity and original session time.")
          analytics_impl = (root / "core/data/src/commonMain/kotlin/com/maxrave/data/repository/AnalyticsRepositoryImpl.kt").read_text()
          if "                    syncId," not in analytics_impl or "                    timestamp," not in analytics_impl:
              raise SystemExit("AnalyticsRepositoryImpl does not forward checkpoint identity and timestamp.")
          for handler_path in required[3:5]:
              handler = (root / handler_path).read_text()
              for marker in ("listeningRecoveryReady.await()", "persistListeningCheckpoint", "recoverListeningCheckpoint", "persistCompletedListeningSession"):
                  if marker not in handler:
                      raise SystemExit(f"Crash-safe checkpoint marker {marker} is missing from {handler_path}.")
              if "mayBeTrackingListeningLocal" in handler:
                  raise SystemExit(f"The legacy percentage-based tracker still overlaps the 30-second Insights accumulator in {handler_path}.")

          screen = (root / required[7]).read_text()
          if "CUSTOM_RANGE" not in screen or "DateRangePicker" not in screen:
              raise SystemExit("Custom date-range filtering is incomplete.")

          app = (root / required[5]).read_text()
          if "AnalyticsDestination" not in app:
              raise SystemExit("The Insights destination is not wired into the app.")

          account_settings = root / "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/SettingScreen.kt"
          account_ui = account_settings.read_text()
          settings_view_model = root / "composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/SettingsViewModel.kt"
          if "selectedYouTubeGoogleEmail" not in settings_view_model.read_text():
              raise SystemExit("The selected YouTube Google identity lookup is missing.")
          if "selectedYouTubeGoogleEmail" not in account_ui or "SimpCloud matching unavailable" not in account_ui or "YouTube Google email:" not in account_ui:
              raise SystemExit("The selected YouTube account matching diagnostic is missing or mislabeled.")

          resources = root / "composeApp/src/commonMain/composeResources/values/strings.xml"
          resource_root = ET.parse(resources).getroot()
          resource_names = [item.attrib.get("name") for item in resource_root if item.tag == "string"]
          for required_string in ("this_month", "all_time"):
              if resource_names.count(required_string) != 1:
                  raise SystemExit(f"Insights resource {required_string} is missing or duplicated.")
          print("Insights merge checks passed: files, 30-second threshold, stall guard, date filters, navigation and XML.")
          PY

      - name: Check merged source formatting and conflict markers
        run: |
          git diff --check
          git -C core diff --check
          python3 - <<'PY'
          import pathlib
          roots = [pathlib.Path("."), pathlib.Path("core")]
          markers = ("<<<<<<< ", "=======", ">>>>>>> ")
          bad = []
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or ".git" in path.parts or path.suffix not in {".kt", ".kts", ".xml"}:
                      continue
                  try:
                      lines = path.read_text().splitlines()
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(lines, 1):
                      if line.startswith(markers):
                          bad.append(f"{path}:{number}")
          if bad:
              raise SystemExit("Unresolved merge markers: " + ", ".join(bad[:30]))
          print("Whitespace and merge-marker checks passed.")
          PY

      - name: Configure build, upstream services, and Supabase
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "isFullBuild=true" >> gradle.properties
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing Supabase GitHub secrets."
            exit 1
          fi
          : > local.properties
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> local.properties
          printf 'SENTRY_AUTH_TOKEN=%s\n' "$SENTRY_AUTH_TOKEN" >> local.properties
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" >> local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          printf 'DISCORD_CLIENT_ID=%s\n' "$DISCORD_CLIENT_ID" >> local.properties
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> local.properties

      - name: Validate Supabase BuildKonfig wiring
        run: |
          grep -q '"supabaseUrl"' composeApp/build.gradle.kts
          grep -q '"supabasePublishableKey"' composeApp/build.gradle.kts
          grep -q 'properties.getProperty("SUPABASE_URL")' composeApp/build.gradle.kts
          grep -q 'properties.getProperty("SUPABASE_PUBLISHABLE_KEY")' composeApp/build.gradle.kts

      - name: Apply SimpCloud Google OAuth foundation
        run: |
          git apply --check SimpMusic-Cloud-Sync-Auth-Stage1.patch
          git apply SimpMusic-Cloud-Sync-Auth-Stage1.patch

      - name: Apply SimpCloud 2.7-compatible interface foundation
        run: |
          git apply --check SimpMusic-Cloud-Sync-Stage2-UI-2.7.patch
          git apply SimpMusic-Cloud-Sync-Stage2-UI-2.7.patch
          git apply --check SimpMusic-Cloud-Sync-Stage2-UI-2.7-Integration.patch
          git apply SimpMusic-Cloud-Sync-Stage2-UI-2.7-Integration.patch

      - name: Apply SimpCloud playback sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V13-Playback.patch
          git apply SimpMusic-Cloud-Sync-V13-Playback.patch

      - name: Apply SimpCloud V14 automatic sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V14-AutoSync.patch
          git apply SimpMusic-Cloud-Sync-V14-AutoSync.patch

      - name: Apply SimpCloud V14 realtime and manual sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V14-Realtime.patch
          git apply SimpMusic-Cloud-Sync-V14-Realtime.patch

      - name: Enforce selected YouTube and SimpCloud account matching
        run: |
          git apply --check SimpMusic-Cloud-Sync-V17-Account-Matching.patch
          git apply SimpMusic-Cloud-Sync-V17-Account-Matching.patch


      - name: Apply SimpCloud V15 immediate manual sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V15-ManualSync.patch
          git apply SimpMusic-Cloud-Sync-V15-ManualSync.patch

      - name: Apply SimpCloud V16 full settings sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V16-FullSettings.patch
          git apply SimpMusic-Cloud-Sync-V16-FullSettings.patch

      - name: Add 2.7 settings to cloud sync
        run: |
          git apply --check SimpMusic-Cloud-Sync-V17-Settings-Keys.patch
          git apply SimpMusic-Cloud-Sync-V17-Settings-Keys.patch

      - name: Preserve complete YouTube playlist shuffle without replacing 2.7 code
        run: |
          python3 -m py_compile v17-overlay/apply_shuffle_fix.py
          python3 v17-overlay/apply_shuffle_fix.py

      - name: Validate full-playlist shuffle and Google identity extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          playlist = Path("composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/PlaylistViewModel.kt").read_text()
          for marker in (
              "V17 full-playlist fallback: load every continuation page",
              "while (!nextContinuation.isNullOrEmpty())",
              "visitedContinuations.add(nextContinuation)",
              "getContinueTrack(",
              "val shuffledTracks = allTracks.shuffled()",
              "playlistType = PlaylistType.PLAYLIST",
          ):
              if marker not in playlist:
                  raise SystemExit(f"Full-playlist shuffle fallback is incomplete: {marker}")

          # The official 2.7 endpoint branch must remain present alongside the fallback.
          if "songRepository.getRadioFromEndpoint(shuffleEndpoint)" not in playlist:
              raise SystemExit("Official 2.7 shuffle endpoint path was replaced.")

          switcher = Path("core/service/kotlinYtmusicScraper/src/commonMain/kotlin/com/maxrave/kotlinytmusicscraper/models/response/AccountSwitcherEndpointResponse.kt").read_text()
          mapping = Path("core/data/src/commonMain/kotlin/com/maxrave/data/mapping/Mapping.kt").read_text()
          if "googleAccountHeaderRenderer" not in switcher or "googleEmail = googleEmail" not in switcher:
              raise SystemExit("YouTube account-switcher Google email extraction is missing.")
          if "googleEmail = this.googleEmail" not in mapping:
              raise SystemExit("YouTube account Google email is not forwarded into the domain model.")
          print("Shuffle fallback and selected-account email extraction checks passed.")
          PY

      - name: Keep Insights recovery checkpoints device-local
        run: |
          SETTINGS_SYNC="androidApp/src/main/java/com/maxrave/simpmusic/cloudsync/CloudSyncSettingsSync.kt"
          grep -q 'it.key.name in KEYS_BY_CATEGORY.getValue(category)' "$SETTINGS_SYNC"
          if grep -q 'analytics_active_listening_checkpoint_v1' "$SETTINGS_SYNC"; then
            echo "::error::The unfinished local Insights checkpoint must never be copied between devices."
            exit 1
          fi

      - name: Final source hygiene after all custom patches
        run: |
          git diff --check
          git -C core diff --check
          if grep -R -n -E '^(<<<<<<< |=======|>>>>>>> )' androidApp composeApp core/data core/domain --include='*.kt' --include='*.kts' --include='*.xml'; then
            echo "::error::Unresolved merge markers remain after custom patch application."
            exit 1
          fi

      - name: Verify upstream base
        run: |
          grep -q 'version-name = "2.7.0"' gradle/libs.versions.toml
          CORE_BASE="$(git ls-tree HEAD core | awk '{print $3}')"
          git -C core cat-file -e "$CORE_BASE^{commit}"
          git -C core merge-base --is-ancestor "$CORE_BASE" HEAD
          test "$(git -C core rev-parse HEAD)" = "88c1cf256f57ca07d90993d5fc966e96a71ecedb"

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew -PisFullBuild=true androidApp:assembleDebug

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
